# API gateway routing pattern (e.g. KrakenD or direct Ingress backends)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-api
                port:
                  number: 8080
          - path: /api/v1/health
            pathType: Exact
            backend:
              service:
                name: payment-api
                port:
                  number: 8080
